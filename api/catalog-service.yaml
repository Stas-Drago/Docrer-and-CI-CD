        '409':
          description: Конфликт
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-409
                title: Конфликт
                status: 409
                detail: Описание ошибки
                traceId: trace-42
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
