openapi: 3.1.0
info:
  title: catalog-service
  version: 1.0.0
  description: Платформа онлайн курсов по математике
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.mathcourses.example
security:
- bearerAuth: []
tags:
- name: public
  description: Через API Gateway
- name: internal
  description: Только для сервисов
paths:
  /api/v1/courses:
    post:
      tags:
      - public
      summary: POST /api/v1/courses
      operationId: postApiV1Courses
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              example:
                id: course-101
                title: Алгебра для ЕГЭ
                priceRub: 2490
                status: PUBLISHED
                teacherId: teacher-7
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-400
                title: Некорректный запрос
                status: 400
                detail: Описание ошибки
                traceId: trace-42
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-401
                title: Не авторизован
                status: 401
                detail: Описание ошибки
                traceId: trace-42
        '404':
          description: Не найдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-404
                title: Не найдено
                status: 404
                detail: Описание ошибки
                traceId: trace-42
        '409':
          description: Конфликт
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-409
                title: Конфликт
                status: 409
                detail: Описание ошибки
                traceId: trace-42
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-503
                title: Сервис недоступен
                status: 503
                detail: Описание ошибки
                traceId: trace-42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              title: Алгебра для ЕГЭ
              priceRub: 2490
    get:
      tags:
      - public
      summary: GET /api/v1/courses
      operationId: getApiV1Courses
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
              example:
                items: []
                page: 1
                size: 20
                total: 0
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-400
                title: Некорректный запрос
                status: 400
                detail: Описание ошибки
                traceId: trace-42
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-401
                title: Не авторизован
                status: 401
                detail: Описание ошибки
                traceId: trace-42
        '404':
          description: Не найдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-404
                title: Не найдено
                status: 404
                detail: Описание ошибки
                traceId: trace-42
        '409':
          description: Конфликт
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-409
                title: Конфликт
                status: 409
                detail: Описание ошибки
                traceId: trace-42
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-503
                title: Сервис недоступен
                status: 503
                detail: Описание ошибки
                traceId: trace-42
  /api/v1/courses/{courseId}:
