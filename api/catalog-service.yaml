components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - traceId
      properties:
        type:
          type: string
          example: https://mathcourses.example/problems/conflict
        title:
          type: string
          example: Конфликт
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Запись уже существует
        traceId:
          type: string
          example: trace-42
    Course:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - priceRub
      - status
      - teacherId
      properties:
        id:
          type: string
          example: course-101
        title:
          type: string
          example: Алгебра для ЕГЭ
        priceRub:
          type: integer
          example: 2490
        status:
          type: string
          example: PUBLISHED
        teacherId:
          type: string
          example: teacher-7
    CourseList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - priceRub
      properties:
        title:
          type: string
          example: Алгебра для ЕГЭ
        priceRub:
          type: integer
          example: 2490
    Event_course_updated:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: course.updated
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - courseId
          - status
          properties:
            courseId:
              type: string
              example: course-101
            status:
              type: string
              example: PUBLISHED
