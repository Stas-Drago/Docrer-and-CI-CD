components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - traceId
      properties:
        type:
          type: string
          example: https://mathcourses.example/problems/conflict
        title:
          type: string
          example: Конфликт
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Запись уже существует
        traceId:
          type: string
          example: trace-42
    Enrollment:
      type: object
      additionalProperties: false
      required:
      - id
      - courseId
      - studentId
      - priceRub
      - status
      properties:
        id:
          type: string
          example: enr-42
        courseId:
          type: string
          example: course-101
        studentId:
          type: string
          example: student-7
        priceRub:
          type: integer
          example: 2490
        status:
          type: string
          example: PENDING_PAYMENT
    EnrollmentList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    CreateEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - courseId
      properties:
        courseId:
          type: string
          example: course-101
    ActivateEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - correlationId
      properties:
        paymentId:
          type: string
          example: pay-42
        correlationId:
          type: string
          example: corr-42
    Event_course_updated:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: course.updated
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - courseId
          - status
          properties:
            courseId:
              type: string
              example: course-101
            status:
              type: string
              example: PUBLISHED
    Event_enrollment_created:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: enrollment.created
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - enrollmentId
          - courseId
          - studentId
          - amountRub
          properties:
            enrollmentId:
              type: string
              example: enr-42
            courseId:
              type: string
              example: course-101
            studentId:
              type: string
              example: student-7
            amountRub:
              type: integer
              example: 2490
    Event_payment_succeeded:
