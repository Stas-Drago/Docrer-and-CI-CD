openapi: 3.1.0
info:
  title: payment-service
  version: 1.0.0
  description: Платформа онлайн курсов по математике
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.mathcourses.example
security:
- bearerAuth: []
tags:
- name: public
  description: Через API Gateway
- name: internal
  description: Только для сервисов
paths:
  /api/v1/payments/{paymentId}:
    get:
      tags:
      - public
      summary: GET /api/v1/payments/{paymentId}
      operationId: getApiV1PaymentsPaymentid
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          example: example-42
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: pay-42
                enrollmentId: enr-42
                amountRub: 2490
                status: SUCCEEDED
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-400
                title: Некорректный запрос
                status: 400
                detail: Описание ошибки
                traceId: trace-42
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-401
                title: Не авторизован
                status: 401
                detail: Описание ошибки
                traceId: trace-42
        '404':
          description: Не найдено
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-404
                title: Не найдено
                status: 404
                detail: Описание ошибки
                traceId: trace-42
        '409':
          description: Конфликт
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-409
                title: Конфликт
                status: 409
                detail: Описание ошибки
                traceId: trace-42
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://mathcourses.example/problems/http-503
