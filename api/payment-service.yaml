components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - traceId
      properties:
        type:
          type: string
          example: https://mathcourses.example/problems/conflict
        title:
          type: string
          example: Конфликт
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Запись уже существует
        traceId:
          type: string
          example: trace-42
    Payment:
      type: object
      additionalProperties: false
      required:
      - id
      - enrollmentId
      - amountRub
      - status
      properties:
        id:
          type: string
          example: pay-42
        enrollmentId:
          type: string
          example: enr-42
        amountRub:
          type: integer
          example: 2490
        status:
          type: string
          example: SUCCEEDED
    PaymentList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
    ChargeRequest:
      type: object
      additionalProperties: false
      required:
      - enrollmentId
      - amountRub
      - correlationId
      properties:
        enrollmentId:
          type: string
          example: enr-42
        amountRub:
          type: integer
          example: 2490
        correlationId:
          type: string
          example: corr-42
    RefundRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - correlationId
      properties:
        reason:
          type: string
          example: Не удалось открыть доступ
        correlationId:
          type: string
          example: corr-42
    Event_enrollment_created:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: enrollment.created
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - enrollmentId
          - courseId
          - studentId
          - amountRub
          properties:
            enrollmentId:
              type: string
              example: enr-42
            courseId:
              type: string
              example: course-101
            studentId:
              type: string
              example: student-7
            amountRub:
              type: integer
              example: 2490
    Event_payment_succeeded:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: payment.succeeded
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - enrollmentId
          - paymentId
          properties:
            enrollmentId:
              type: string
              example: enr-42
            paymentId:
              type: string
              example: pay-42
    Event_payment_failed:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: payment.failed
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - enrollmentId
          - reason
          properties:
            enrollmentId:
              type: string
              example: enr-42
            reason:
              type: string
              example: declined
    Event_payment_refunded:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: e97f4c5a-794e-4dbd-94b1-67e5771076c7
        eventType:
          type: string
          example: payment.refunded
        occurredAt:
          type: string
          format: date-time
          example: '2026-11-06T10:00:00Z'
        schemaVersion:
          type: integer
          example: 1
        correlationId:
          type: string
          example: corr-42
        payload:
          type: object
          additionalProperties: false
          required:
          - enrollmentId
          - paymentId
          properties:
            enrollmentId:
              type: string
              example: enr-42
            paymentId:
              type: string
              example: pay-42
